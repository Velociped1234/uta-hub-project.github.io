<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uta Hub | Get Script</title>
    
    <!-- ИКОНКА ДЛЯ ВКЛАДКИ БРАУЗЕРА -->
    <link rel="icon" type="image/png" href="https://d1wzdj81h1hubn.cloudfront.net/03f671adbbe471e5.png">
    
    <!-- ИКОНКИ FONTAWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        
        /* СТИЛЬ ФОНА ИЗ САМОЙ ПЕРВОЙ СТРАНИЦЫ */
        body { 
            background: radial-gradient(circle, #161026 0%, #0b0b0e 100%);
            color: #fff; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* АНИМАЦИЯ ЗВЕЗД ИЗ ПЕРВОЙ СТРАНИЦЫ */
        .star {
            position: absolute; background-color: #fff; border-radius: 50%; pointer-events: none; opacity: 0; animation: twinkle ease-in-out infinite;
            z-index: 1;
        }
        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
            100% { opacity: 0; transform: scale(0.5); }
        }

        /* КАРТОЧКА В СТИЛЕ ЛОКЕРА */
        .get-script-card {
            background: rgba(17, 17, 22, 0.75);
            border: 2px solid rgba(202, 19, 212, 0.3);
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            padding: 40px 30px;
            box-shadow: 0 0 35px rgba(202, 19, 212, 0.2);
            backdrop-filter: blur(12px);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* ПЕРЕВОРАЧИВАЮЩИЕСЯ ЧАСЫ */
        .card-icon {
            font-size: 40px;
            color: #ca13d4;
            margin-bottom: 15px;
            display: inline-block;
            animation: flipClock 2s infinite ease-in-out;
        }

        @keyframes flipClock {
            0% { transform: rotate(0deg); }
            40% { transform: rotate(180deg); }
            50% { transform: rotate(180deg); }
            90% { transform: rotate(360deg); }
            100% { transform: rotate(360deg); }
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-sub {
            font-size: 14px;
            color: #858594;
            margin-bottom: 30px;
        }

        /* ТАЙМЕР ПО ЦЕНТРУ (Цвет #e34beb) */
        .timer-box {
            font-size: 54px;
            font-weight: 800;
            color: #e34beb;
            text-shadow: 0 0 20px rgba(227, 75, 235, 0.6);
            margin: 20px 0;
            font-family: monospace;
        }

        /* КНОПКА СКАЧИВАНИЯ СКРИПТА */
        .btn-get {
            display: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            background: #ca13d4;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(202, 19, 212, 0.4);
            animation: fadeIn 0.5s ease forwards;
        }

        .btn-get:hover {
            background: #e61df5;
            box-shadow: 0 0 30px #e61df5;
            transform: scale(1.02);
        }

        /* ОКНО СО СКРИПТОМ И КНОПКОЙ COPY */
        .script-output {
            display: none;
            margin-top: 10px;
            background: #07070a;
            border: 2px solid #db2ad5;
            padding: 18px;
            border-radius: 10px;
            text-align: left;
            animation: blinkBorder 1.5s infinite ease-in-out, slideUp 0.4s ease forwards;
        }

        .script-output h5 { 
            color: #db2ad5; 
            margin-bottom: 10px; 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .script-code-box {
            font-family: monospace;
            background: #111116;
            padding: 12px;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            word-break: break-all;
            user-select: all;
            border: 1px solid rgba(219, 42, 213, 0.2);
            text-shadow: 0 0 5px rgba(219, 42, 213, 0.5);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* КНОПКА СКОПИРОВАТЬ ИЗ ЗАДАНИЯ (Цвет #e004d9) */
        .btn-copy {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            background: #e004d9;
            color: #fff;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 0 15px rgba(224, 4, 217, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-copy:hover {
            background: #ff19f7;
            box-shadow: 0 0 25px #ff19f7;
        }

        /* АНИМАЦИЯ МИГАНИЯ ДЛЯ СВЕЧЕНИЯ СКРИПТА (#db2ad5) */
        @keyframes blinkBorder {
            0%, 100% { border-color: #db2ad5; box-shadow: 0 0 15px rgba(219, 42, 213, 0.3); }
            50% { border-color: #ff52f9; box-shadow: 0 0 30px rgba(255, 82, 249, 0.7); }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="get-script-card">
        <div class="card-icon"><i class="fa-solid fa-hourglass-half"></i></div>
        <div class="card-title" id="statusTitle">Ваша ссылка готова!</div>
        <div class="card-sub" id="statusSub">Пожалуйста, подождите генерацию вашей персональной ссылки</div>
        
        <!-- Таймер 10 секунд -->
        <div class="timer-box" id="timer">10</div>

        <!-- Кнопка генерации скрипта -->
        <button class="btn-get" id="claimScriptBtn"><i class="fa-solid fa-code"></i> Claim Script</button>

        <!-- Окно со скриптом (Мигающее цветом #db2ad5) -->
        <div class="script-output" id="scriptOutput">
            <h5><i class="fa-solid fa-terminal"></i> Ваш Скрипт:</h5>
            <div class="script-code-box" id="scriptText">loadstring(game:HttpGet("https://raw.githubusercontent.com/Velociped1234/Uta-Hub-MM2-Script/main/main.lua"))()</div>
            
            <!-- Кнопка Копирования -->
            <button class="btn-copy" id="copyBtn"><i class="fa-solid fa-copy"></i> Copy Script</button>
        </div>
    </div>

    <script>
        // ГЕНЕРАЦИЯ ЗВЕЗД ИЗ ПЕРВОЙ СТРАНИЦЫ
        function createStars() {
            const starCount = 50;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's'; 
                star.style.animationDelay = (Math.random() * 5) + 's';
                document.body.appendChild(star);
            }
        }
        createStars();

        let timeLeft = 10;
        const timerElement = document.getElementById('timer');
        const claimBtn = document.getElementById('claimScriptBtn');
        const statusTitle = document.getElementById('statusTitle');
        const statusSub = document.getElementById('statusSub');
        const scriptOutput = document.getElementById('scriptOutput');
        const copyBtn = document.getElementById('copyBtn');

        let clickCount = 0;

        // Таймер обратного отсчета
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.style.display = 'none'; 
                
                statusTitle.textContent = "Link is Ready!";
                statusSub.textContent = "Нажмите на кнопку ниже, чтобы забрать ваш скрипт";
                
                claimBtn.style.display = 'block';
            }
        }, 1000);

        // Логика переходов по кликам на кнопку Claim Script
        claimBtn.addEventListener('click', () => {
            clickCount++;

            if (clickCount === 1) {
                // 1 КЛИК: Кидает на Linkvertise
                window.open('https://linkvertise.com/', '_blank');
            } else if (clickCount === 2) {
                // 2 КЛИК: Кидает на Platoboost
                window.open('https://platoboost.app/', '_blank');
            } else if (clickCount === 3) {
                // 3 КЛИК: Показывает мигающий скрипт
                claimBtn.style.display = 'none';
                statusTitle.textContent = "Success!";
                statusSub.textContent = "Скопируйте скрипт и вставьте его в инжектор";
                scriptOutput.style.display = 'block';
            }
        });

        // Логика кнопки Copy Script
        copyBtn.addEventListener('click', () => {
            const scriptText = document.getElementById('scriptText').innerText;
            
            // Копирование в буфер обмена
            navigator.clipboard.writeText(scriptText).then(() => {
                // Меняем текст кнопки при успешном копировании
                copyBtn.innerHTML = '<i class="fa-solid fa-heart"></i> Спасибо что выбрали именно нас!';
            });
        });
    </script>
</body>
</html>
