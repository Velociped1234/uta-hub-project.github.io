<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uta Hub | Соцсети</title>
    
    <!-- ИКОНКА ДЛЯ БРАУЗЕРА -->
    <link rel="icon" type="image/png" href="https://d1wzdj81h1hubn.cloudfront.net/03f671adbbe471e5.png">
    
    <!-- Ссылка на иконки FONTAWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; scroll-behavior: smooth; }
        
        /* Пееременные(цветовыые для темы) */
        body { background: #0b0b0e; color: #fff; overflow: hidden; transition: background 0.5s, color 0.5s; }
        .highlight { color: #a855f7; text-shadow: 0 0 15px rgba(168,85,247,0.6); }

        /* --- СТИЛИ для Белой темы --- */
        body.light-theme { background: #eef0f3; color: #1a1a24; }
        body.light-theme .navbar { background: rgba(238, 240, 243, 0.85); border-bottom: 1px solid rgba(168, 85, 247, 0.2); }
        body.light-theme .logo, body.light-theme .nav-links a { color: #1a1a24; }
        body.light-theme .social-card { background: rgba(0, 0, 0, 0.03); border-color: rgba(168, 85, 247, 0.2); color: #1a1a24; }
        body.light-theme .social-card p { color: #4b5563; }
        body.light-theme .settings-content { background: #f7f7fa; }
        body.light-theme .settings-content h3 { color: #1a1a24; }
        body.light-theme .settings-item { background: rgba(0, 0, 0, 0.02); border-color: rgba(168, 85, 247, 0.2); color: #374151; }
        body.light-theme .opacity-badge { background: rgba(0, 0, 0, 0.05); color: #1a1a24; }

        /* (PRELOADER) */
        .intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: radial-gradient(circle, #161026 0%, #0b0b0e 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; overflow: hidden;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.6s ease;
            transform: translateY(0);
        }

        .star { position: absolute; background-color: #fff; border-radius: 50%; pointer-events: none; opacity: 0; animation: twinkle ease-in-out infinite; }
        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
            100% { opacity: 0; transform: scale(0.5); }
        }
        
        .intro-content-wrapper { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; animation: slideUpIn 1.2s ease-out forwards; }
        @keyframes slideUpIn { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .intro-logo-container { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .intro-logo-container img { width: 60px; height: 60px; object-fit: cover; border-radius: 50%; border: 2px solid #e61df5; animation: ninjaBlink 2s infinite ease-in-out; }
        @keyframes ninjaBlink { 0%, 100% { opacity: 1; box-shadow: 0 0 20px rgba(230, 29, 245, 0.8); } 50% { opacity: 0.1; box-shadow: 0 0 2px rgba(230, 29, 245, 0.1); } }

        .intro-title { display: flex; align-items: center; gap: 12px; font-size: 48px; font-weight: 800; letter-spacing: 1px; }
        .uta-text { color: #fff; display: inline-block; animation: blinkWhite 2s infinite ease-in-out; }
        .hub-text { color: #a855f7; display: inline-block; animation: blinkPurple 2s infinite ease-in-out; }
        .key-blink-icon { color: #a855f7; font-size: 38px; display: inline-block; animation: blinkPurple 2s infinite ease-in-out; }

        @keyframes blinkWhite { 0%, 100% { opacity: 1; text-shadow: 0 0 20px rgba(255, 255, 255, 0.8); } 50% { opacity: 0.2; text-shadow: 0 0 2px rgba(255, 255, 255, 0.1); } }
        @keyframes blinkPurple { 0%, 100% { opacity: 1; text-shadow: 0 0 20px rgba(168, 85, 247, 0.8); filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.6)); } 50% { opacity: 0.2; text-shadow: 0 0 2px rgba(168, 85, 247, 0.1); filter: drop-shadow(0 0 0px rgba(168, 85, 247, 0)); } }
        
        .btn-enter { background: rgba(168, 85, 247, 0.1); color: #a855f7; border: 2px solid #a855f7; padding: 12px 45px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(168,85,247,0.2); }
        .btn-enter:hover { background: #a855f7; color: #fff; box-shadow: 0 0 25px #a855f7; transform: scale(1.05); }
        .intro-screen.fade-out { transform: translateY(100%); opacity: 0; pointer-events: none; }

        /* Основной сайт */
        .main-content { opacity: 0; transition: 0.8s ease 0.2s; }
        .main-content.visible { opacity: 1; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(11,11,14,0.85); backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(168,85,247,0.1); transition: background 0.5s; }
        .logo { display: flex; align-items: center; font-size: 24px; font-weight: 800; gap: 12px; }
        .logo img { width: 45px; height: 45px; object-fit: cover; border-radius: 50%; border: 2px solid #e61df5; box-shadow: 0 0 10px rgba(230, 29, 245, 0.6); animation: levitate 3s ease-in-out infinite; }
        @keyframes levitate { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
        .logo span { color: #a855f7; }
        
        .nav-links { display: flex; list-style: none; align-items: center; }
        .nav-links li { margin-left: 30px; }
        .nav-links a { color: #bcbcbc; text-decoration: none; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: #a855f7; }
        
        .nav-settings-btn { color: #bcbcbc; font-size: 20px; cursor: pointer; transition: 0.4s ease; display: flex; align-items: center; }
        .nav-settings-btn:hover { color: #a855f7; transform: rotate(90deg); filter: drop-shadow(0 0 8px #a855f7); }

        /* Окно,гуи настроек */
        .settings-window { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(8, 8, 10, 0.85); backdrop-filter: blur(10px); z-index: 20000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.4s ease; }
        .settings-window.open { opacity: 1; pointer-events: auto; }
        .settings-content { background: #111116; border: 2px solid #a855f7; border-radius: 16px; width: 90%; max-width: 400px; padding: 35px 25px; text-align: center; position: relative; box-shadow: 0 0 35px rgba(168, 85, 247, 0.25); transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease; }
        .settings-window.open .settings-content { transform: scale(1); }
        .close-settings-btn { position: absolute; top: 15px; right: 20px; font-size: 22px; color: #6b7280; cursor: pointer; transition: 0.3s; }
        .close-settings-btn:hover { color: #e61df5; }
        .settings-content h3 { font-size: 24px; margin-bottom: 25px; font-weight: 700; letter-spacing: 1px; color: #fff; }
        
        .settings-list { display: flex; flex-direction: column; gap: 12px; }
        .settings-item { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(168, 85, 247, 0.12); padding: 14px; border-radius: 8px; font-size: 17px; color: #d1d5db; cursor: pointer; transition: 0.3s; font-weight: 500; }
        .settings-item:hover { background: rgba(168, 85, 247, 0.08); border-color: #a855f7; color: #fff; box-shadow: 0 0 12px rgba(168, 85, 247, 0.2); transform: translateY(-2px); }

        .opacity-submenu { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; padding: 5px; animation: fadeIn 0.3s ease; }
        .opacity-badge { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(168, 85, 247, 0.2); padding: 8px; border-radius: 6px; font-size: 14px; color: #fff; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .opacity-badge:hover { background: #a855f7; color: #fff; box-shadow: 0 0 10px #a855f7; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* Центральный блок для соц сетей */
        .links-hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 20px 20px;
            background: radial-gradient(circle, rgba(168,85,247,0.1) 0%, transparent 60%);
        }
        
        .links-hero h1 { font-size: 42px; margin-bottom: 50px; text-align: center; }

        .socials-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap; /* Чтобы на телефонах переносилось красиво */
            max-width: 1000px;
            width: 100%;
        }

        .social-card { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(168, 85, 247, 0.15); 
            padding: 40px 30px; 
            border-radius: 16px; 
            transition: 0.3s; 
            text-decoration: none; 
            color: #fff; 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 280px; /* Фиксированная ширина для ровности */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .social-card:hover { transform: translateY(-8px); border-color: #a855f7; box-shadow: 0 15px 35px rgba(168, 85, 247, 0.25); }
        .social-icon { font-size: 60px; color: #a855f7; margin-bottom: 20px; transition: 0.3s; }
        .social-card:hover .social-icon { transform: scale(1.1); }
        .social-card h3 { font-size: 24px; margin-bottom: 10px; font-weight: 700; }
        .social-card p { color: #9ca3af; font-size: 15px; line-height: 1.5; }

        /* Специфичные цвета при наведении (по желанию) */
        .card-tiktok:hover .social-icon { color: #ff0050; text-shadow: 2px 2px 0 #00f2fe; }
        .card-youtube:hover .social-icon { color: #ff0000; }
        .card-telegram:hover .social-icon { color: #0088cc; }

    </style>
</head>
<body style="overflow: auto;">

    <!-- Стартовый экран -->
    <div class="intro-screen fade-out" id="introScreen">
        <!-- (Звезды генерируются скриптом) -->
        <div class="intro-content-wrapper">
            <div class="intro-logo-container">
                <img src="https://d1wzdj81h1hubn.cloudfront.net/03f671adbbe471e5.png" alt="Logo">
                <div class="intro-title">
                    <span class="uta-text">UTA</span> 
                    <span class="hub-text">HUB</span>
                    <i class="fa-solid fa-key key-blink-icon"></i>
                </div>
            </div>
            <button class="btn-enter" id="enterBtn">✦ Enter ✦</button>
        </div>
    </div>

    <!-- Окно настроек -->
    <div class="settings-window" id="settingsWindow">
        <div class="settings-content" id="settingsContent">
            <i class="fa-solid fa-xmark close-settings-btn" id="closeSettingsBtn"></i>
            <h3>Настройки</h3>
            <div class="settings-list">
                <div class="settings-item" id="themeToggleBtn">Тема</div>
                <div class="settings-item" id="opacityMenuBtn">Прозрачность</div>
                <div class="opacity-submenu" id="opacitySubmenu">
                    <div class="opacity-badge" data-value="0.1">10%</div>
                    <div class="opacity-badge" data-value="0.3">30%</div>
                    <div class="opacity-badge" data-value="0.5">50%</div>
                    <div class="opacity-badge" data-value="0.75">75%</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ СТРАНИЦЫ ССЫЛОК -->
    <div class="main-content visible" id="mainContent">
        
        <!-- Шапочка -->
        <header class="navbar">
            <div class="logo">
                <img src="https://d1wzdj81h1hubn.cloudfront.net/03f671adbbe471e5.png" alt="Logo">
                UTA <span>HUB</span>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html"><i class="fa-solid fa-arrow-left"></i> На главную</a></li>
                    <li><i class="fa-solid fa-gear nav-settings-btn" id="openSettingsBtn" style="margin-left: 20px;"></i></li>
                </ul>
            </nav>
        </header>

        <!-- центр. блок с прямоугольниками -->
        <section class="links-hero">
            <h1>Наши <span class="highlight">Соцсети</span></h1>
            
            <div class="socials-container">
                <!-- Прямоугольник TikTok -->
                <a href="https://www.tiktok.com/@veloscripter?_r=1&_t=ZS-97rHuT9ZLDr" target="_blank" class="social-card card-tiktok">
                    <i class="fa-brands fa-tiktok social-icon"></i>
                    <h3>TikTok</h3>
                    <p>Короткие видео с крутыми разносами сервера.</p>
                </a>
                
                <!-- Прямоугольник YouTube -->
                <a href="https://www.youtube.com/@veloscripter" target="_blank" class="social-card card-youtube">
                    <i class="fa-brands fa-youtube social-icon"></i>
                    <h3>YouTube</h3>
                    <p>Полноценные обзоры на скрипт, туторы и советы.</p>
                </a>
                
                <!-- Прямоугольник Telegram -->
                <a href="https://t.me/VeloScripter" target="_blank" class="social-card card-telegram">
                    <i class="fa-brands fa-telegram social-icon"></i>
                    <h3>Telegram</h3>
                    <p>Новости, файлы скриптов и тд.</p>
                </a>
            </div>
        </section>

    </div>

    <script>
        // Генерация Звёзд
        function createStars() {
            const introScreen = document.getElementById('introScreen');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's'; 
                star.style.animationDelay = (Math.random() * 5) + 's';
                introScreen.insertBefore(star, introScreen.firstChild);
            }
        }
        createStars();

        // ЛОГИКА ВХОДА
        const introScreen = document.getElementById('introScreen');
        const enterBtn = document.getElementById('enterBtn');
        const mainContent = document.getElementById('mainContent');

        enterBtn.addEventListener('click', () => {
            introScreen.classList.add('fade-out');
            mainContent.classList.add('visible');
            document.body.style.overflow = 'auto';
        });

        // Модальное окно настроек
        const settingsWindow = document.getElementById('settingsWindow');
        const settingsContent = document.getElementById('settingsContent');
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');

        openSettingsBtn.addEventListener('click', () => settingsWindow.classList.add('open'));
        closeSettingsBtn.addEventListener('click', () => settingsWindow.classList.remove('open'));
        settingsWindow.addEventListener('click', (e) => { if (e.target === settingsWindow) settingsWindow.classList.remove('open'); });

        // ФУНКЦИОНАЛ: ПЕРЕКЛЮЧЕНИЕ ТЕМЫ
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
        });

        // ФУНКЦИОНАЛ: МЕНЮ ПРОЗРАЧНОСТИ
        const opacityMenuBtn = document.getElementById('opacityMenuBtn');
        const opacitySubmenu = document.getElementById('opacitySubmenu');
        
        opacityMenuBtn.addEventListener('click', () => {
            if (opacitySubmenu.style.display === 'grid') opacitySubmenu.style.display = 'none';
            else opacitySubmenu.style.display = 'grid';
        });

        const opacityBadges = document.querySelectorAll('.opacity-badge');
        opacityBadges.forEach(badge => {
            badge.addEventListener('click', () => {
                settingsContent.style.opacity = badge.getAttribute('data-value');
            });
        });
    </script>

</body></html>
